#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:.4em;background:var(--paper);border:3px solid var(--ink);border-radius:999px;
  padding:.35em .9em;font-weight:800;font-size:clamp(14px,2.2vw,18px);box-shadow:0 4px 0 var(--ink);white-space:nowrap}
button{font-family:var(--ui-font);cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#topL{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;max-width:60vw}
#topR{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:flex-start}
#coins{background:var(--packet)}
#bagChip{cursor:pointer}
#weather{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.round{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);font-size:20px;display:grid;place-items:center;padding:0}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#quest{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));width:min(250px,42vw);
  background:var(--paper);border:3px solid var(--ink);border-radius:6px 16px 10px 14px;padding:10px 12px 12px;box-shadow:0 5px 0 var(--ink);
  font-family:var(--hand-font);font-size:18px;line-height:1.25;transform:rotate(1.2deg)}
#quest .qh{font-family:var(--ui-font);font-weight:800;font-size:13px;color:var(--ink-soft)}
#quest .bar{height:10px;border:2px solid var(--ink);border-radius:6px;background:var(--paper-2);margin-top:6px;overflow:hidden}
#quest .bar i{display:block;height:100%;background:var(--leaf);width:0;transition:width .3s}
#quest .rw{font-family:var(--ui-font);font-size:13px;font-weight:700;margin-top:5px}
#hotbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;
  max-width:calc(100vw - 24px);overflow-x:auto;padding:4px 4px 8px;scrollbar-width:none}
#hotbar::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;width:62px;height:66px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:0 4px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:26px;line-height:1;padding:2px}
.slot small{font-size:10px;font-weight:700;margin-top:3px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .n{position:absolute;top:2px;right:4px;font-size:11px;font-weight:800}
.slot .k{position:absolute;top:2px;left:5px;font-size:10px;font-weight:700;opacity:.55}
.slot.sel{background:var(--packet);transform:translateY(-6px);box-shadow:0 10px 0 var(--ink)}
.slot .rs{position:absolute;bottom:0;left:0;right:0;height:5px;border-radius:0 0 8px 8px}
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));pointer-events:none;
  background:rgba(58,38,23,.88);color:#fff6dc;border-radius:12px;padding:.45em .9em;font-weight:700;font-size:16px;opacity:0;transition:opacity .15s;white-space:nowrap}
#prompt kbd{background:var(--packet);color:var(--ink);border-radius:6px;padding:0 .4em;margin-right:.4em;font-family:var(--ui-font)}
#tip{position:fixed;pointer-events:none;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;
  transform:translate(-50%,-100%);white-space:nowrap;opacity:0;transition:opacity .15s;box-shadow:0 3px 0 var(--ink);line-height:1.35}
#tip .pb{height:7px;border:2px solid var(--ink);border-radius:5px;margin-top:4px;background:var(--paper-2);overflow:hidden}
#tip .pb i{display:block;height:100%;background:var(--leaf)}
#floats{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);white-space:nowrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,520px)}
.toast{background:var(--ink);color:var(--paper);padding:.5em 1em;border-radius:12px;font-weight:700;font-size:15px;animation:tin .25s ease-out;text-align:center}
.toast.good{background:var(--leaf-d)} .toast.warn{background:var(--tomato)} .toast.gold{background:linear-gradient(90deg,#c88a10,#f6c945,#c88a10);color:var(--ink)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#banner{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(.8);font-weight:800;font-size:clamp(28px,6vw,54px);color:#fff;
  text-shadow:0 4px 0 var(--ink),0 0 20px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:all .4s;text-align:center;white-space:nowrap}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner small{display:block;font-size:.4em;font-weight:700}
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;
  background:rgba(255,246,220,.25);border:3px solid rgba(58,38,23,.55);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
#actBtn{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;
  background:var(--packet);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-size:34px;display:none;touch-action:none}
#actBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.touch #joy,.touch #actBtn{display:block}
.touch #prompt{bottom:calc(206px + env(safe-area-inset-bottom,0px))}
/* modals */
#modal{position:fixed;inset:0;background:rgba(40,25,12,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.on{display:flex}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);width:min(560px,100%);max-height:calc(100% - 20px);
  display:flex;flex-direction:column;overflow:hidden;animation:pin .2s ease-out}
@keyframes pin{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.panel header{padding:14px 18px 10px;border-bottom:3px dashed var(--ink-soft);display:flex;align-items:center;gap:12px;background:var(--paper-2)}
.panel header h2{margin:0;font-size:24px;font-weight:800;flex:1}
.panel header .sub{font-size:13px;font-weight:700;color:var(--ink-soft)}
.panel .body{padding:12px 16px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.x{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);font-size:18px;font-weight:800}
.row{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border:3px solid var(--ink);border-radius:14px;margin-bottom:8px;background:#fffdf3;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--rc,#ccc)}
.row .ico{font-size:32px;width:64px;text-align:center;flex:0 0 64px}
.row .ico .pico{width:64px;height:64px;display:block;filter:drop-shadow(0 2px 0 rgba(58,38,23,.35))}
.slot .pico{width:40px;height:40px;display:block;pointer-events:none}
.tico{width:26px;height:26px;vertical-align:-7px;margin-right:4px}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-size:16px}
.row .info .rar{font-size:12px;font-weight:800;color:var(--rc)}
.row .info small{display:block;font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:2px}
.row .buy{text-align:right}
.row .buy small{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-top:3px}
.row.dim{opacity:.5}
.btn{border:3px solid var(--ink);background:var(--packet);border-radius:12px;padding:.5em .9em;font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{background:#d8cfb6;color:#8b7d66;cursor:not-allowed}
.btn.green{background:#8fd15a} .btn.red{background:#f08a6c} .btn.ghost{background:var(--paper)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.letter{font-family:var(--hand-font);font-size:20px;line-height:1.4;white-space:pre-wrap;max-width:60ch;
  background:repeating-linear-gradient(transparent 0 27px,rgba(107,74,48,.18) 27px 28px);padding:4px 2px}
.sign{font-family:var(--hand-font);font-size:22px;text-align:right;margin-top:8px}
.mut{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin:2px 3px 0 0;border:2px solid var(--ink);color:var(--ink)}
.mut.rainbow{background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff8a,#6bc5ff,#c56bff)}
.set{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;font-weight:700}
.set input[type=range]{width:min(220px,46vw);accent-color:var(--leaf-d)}
.seg{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:.4em .8em;font-weight:800;border-right:2px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--packet)}
.keyb{min-width:64px}
/* menu */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:15;
  background:linear-gradient(180deg,rgba(124,194,234,0) 0%,rgba(60,40,20,.35) 100%)}
#menu.off{display:none}
.title{position:relative;text-align:center;margin-bottom:22px}
.title h1{margin:0;font-weight:800;font-size:clamp(46px,11vw,104px);line-height:.95;color:var(--packet);letter-spacing:-.01em;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink)}
.title h1 span{display:block;color:#9be06a}
.title p{margin:14px 0 0;font-family:var(--hand-font);font-size:clamp(18px,3vw,24px);color:#fff;text-shadow:0 2px 0 var(--ink)}
.mbtns{display:flex;flex-direction:column;gap:12px;width:min(300px,80vw)}
.mbtns .btn{font-size:20px;padding:.6em 1em}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#7cc2ea;z-index:30;font-weight:800;font-size:22px}
@media (max-width:640px){
  #quest{font-size:15px;width:min(190px,46vw);top:calc(60px + env(safe-area-inset-top,0px))}
  .slot{width:54px;height:58px;font-size:22px}
  .slot .pico{width:30px;height:30px}
  #weather{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%}
  .touch #weather{bottom:auto;top:calc(56px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));transform:none}
  .chip{padding:.3em .7em}
}
@media (prefers-reduced-motion: reduce){ .panel,.toast{animation:none} #banner{transition:none} }

/* ---- рыбалка ---- */
#fishUI{position:fixed;inset:0;pointer-events:none;z-index:30}
#fPow{position:absolute;left:50%;bottom:150px;transform:translateX(-50%) scale(.9);opacity:0;transition:.15s;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;box-shadow:0 4px 0 var(--ink);width:260px}
#fPow.on{opacity:1;transform:translateX(-50%) scale(1)}
#fPow .lbl{font-weight:800;font-size:13px;margin-bottom:6px;text-align:center}
#fPow .tr{position:relative;height:16px;border-radius:8px;border:2px solid var(--ink);background:linear-gradient(90deg,#9fd0ff,#4aa0e0 60%,#1f5f9a)}
#fPow .tr b{position:absolute;top:-6px;width:6px;height:24px;margin-left:-3px;background:#fff;border:2px solid var(--ink);border-radius:3px}
#fBang{position:absolute;transform:translate(-50%,-100%) scale(0);font:900 54px Rubik,sans-serif;color:#ffd34b;-webkit-text-stroke:3px #3a2617;transition:transform .12s cubic-bezier(.3,1.8,.5,1)}
#fBang.on{transform:translate(-50%,-100%) scale(1);animation:bang .25s infinite alternate}
@keyframes bang{to{transform:translate(-50%,-110%) scale(1.15)}}
#fReel{position:absolute;left:max(24px,6vw);top:50%;transform:translate(-30px,-50%);opacity:0;transition:.2s;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 12px 12px;box-shadow:0 5px 0 var(--ink);width:118px}
#fReel.on{opacity:1;transform:translate(0,-50%)}
#fReel .hd{font:800 17px Rubik,sans-serif;text-align:center;margin-bottom:6px}
#fReel .col{display:flex;gap:8px;justify-content:center}
#fReel .track{position:relative;width:54px;height:min(300px,46vh);border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:linear-gradient(#7cc4f0,#2f78b0 70%,#1f4f7a)}
#fReel .water{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 6px,transparent 6px 18px)}
#fReel .zone{position:absolute;left:3px;right:3px;bottom:0;border-radius:7px;background:rgba(140,230,110,.45);border:3px solid #4fb03a;box-shadow:inset 0 0 10px rgba(255,255,255,.4)}
#fReel .zone.in{background:rgba(160,255,120,.7);border-color:#bfff8a}
#fReel .ff{position:absolute;left:50%;width:40px;height:40px;margin-left:-20px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35));transition:transform .1s}
#fReel .prog{position:relative;width:14px;border:3px solid var(--ink);border-radius:8px;background:#3a2617;overflow:hidden}
#fReel .prog i{position:absolute;left:0;right:0;bottom:0;background:#5fbf4a;transition:background .2s}
#fReel .hint{font-size:11px;font-weight:600;line-height:1.3;margin-top:8px;text-align:center;color:var(--ink-soft)}
#fCard{position:absolute;right:max(24px,6vw);top:56%;transform:translate(0,-40%) scale(.85);opacity:0;pointer-events:none;transition:.22s cubic-bezier(.3,1.5,.5,1);background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px 20px 18px;width:min(320px,86vw);text-align:center}
#fCard.on{opacity:1;transform:translate(0,-50%) scale(1);pointer-events:auto}
#fCard .ic{width:118px;height:118px;margin:-62px auto 4px;border-radius:50%;background:var(--paper);border:3px solid var(--rc);box-shadow:0 0 0 3px var(--ink),0 0 24px var(--rc)}
#fCard .ic img{width:100%;height:100%}
#fCard h3{margin:4px 0 2px;font:800 23px Rubik,sans-serif}
#fCard .rar{font-weight:800;font-size:14px;margin-bottom:8px}
#fCard .stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;font-size:15px;margin:6px 0 10px;padding:8px 12px;background:rgba(58,38,23,.06);border-radius:10px}
#fCard .note{font-family:Neucha,cursive;font-size:18px;line-height:1.35;margin:6px 0 10px}
#fCard .val{font-weight:800;margin-bottom:10px}
#fCard .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-weight:800;font-size:13px;margin-bottom:10px;border:2px solid var(--ink)}
#fCard .badge.new{background:#ffd34b}#fCard .badge.rec{background:#8fd0ff}
#fCard .btn kbd{font-size:11px;margin-left:6px}
.fq{margin-top:8px;padding-top:6px;border-top:2px dashed rgba(58,38,23,.25);font-size:13px;font-weight:600}
.tabs{display:flex;gap:6px;padding:8px 18px 0}
.tabs button{flex:1;font:700 14px Rubik,sans-serif;padding:8px;border:3px solid var(--ink);border-radius:10px 10px 0 0;background:#e8dcc0;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--packet)}
.fqbox{background:#fff8e6;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:600}
.fqbox b{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:2px}
.fqbox .bar{height:10px;border:2px solid var(--ink);border-radius:6px;margin:6px 0 4px;background:#fff;overflow:hidden}.fqbox .bar i{display:block;height:100%;background:#5fbf4a}
.fqbox small{font-size:12px}
.tips{margin-top:10px;font-size:13px;line-height:1.45;font-weight:500;background:rgba(58,38,23,.06);border-radius:10px;padding:10px 12px}.tips b{display:block;margin-bottom:3px}
.fedHi{display:flex;gap:12px;align-items:flex-start}.fedHi img{width:84px;height:84px;flex:0 0 84px}.fedHi p{margin:0;font-family:Neucha,cursive;font-size:19px;line-height:1.35}
.jhead{font-weight:600;margin-bottom:10px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.jc{border:3px solid var(--ink);border-radius:12px;padding:6px 6px 8px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:inset 0 -5px 0 var(--rc)}
.jc img{width:72px;height:72px}.jc b{font-size:14px}.jc .rr{font-size:11px;font-weight:800}.jc small{font-size:11px;font-weight:500;color:var(--ink-soft);line-height:1.25}
.jc.no img{filter:brightness(0) opacity(.35)}.jc.no{background:#f2ead6}
.wish{text-align:center}.wish img{width:130px;height:130px}
.tl{font-family:Neucha,cursive;font-size:20px;line-height:1.4}
@media (max-width:640px){#fReel{left:10px;width:100px}#fCard{right:50%;top:46%;transform:translate(50%,-40%) scale(.85)}#fCard.on{transform:translate(50%,-50%) scale(.92)}#fReel .track{width:46px}#fPow{bottom:170px}}

<canvas id="gl"></canvas>
<div id="vignette"></div>
<div id="floats"></div>
<div id="hud">
  <div id="topL"><span class="chip" id="coins">🪙 <b id="coinV">0</b></span><span class="chip" id="bagChip" role="button" tabindex="0">🎒 <b id="bagV">0/30</b></span></div>
  <div id="weather"><span class="chip" id="timeChip">☀️ День</span><span class="chip" id="wxChip" style="display:none"></span></div>
  <div id="topR"><button class="round" id="pauseBtn" aria-label="Пауза">⏸</button></div>
  <div id="quest"></div>
  <div id="hotbar"></div>
  <div id="joy"><i></i></div>
  <button id="actBtn" aria-label="Действие">✋</button>
</div>
<div id="prompt"></div>
<div id="tip"></div>
<div id="toasts"></div>
<div id="banner"></div>
<div id="modal"></div>

  <div class="title"><h1>Вырасти<span>сад</span></h1><p>Огород деда Ефима ждёт хозяина</p></div>
  <div class="mbtns">
    <button class="btn green" id="playBtn">Играть</button>
    <button class="btn ghost" id="newBtn">Новая игра</button>
    <button class="btn ghost" id="setBtn">Настройки</button>
  </div>
</div>

<script>
'use strict';
// ================= УТИЛИТЫ =================
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = n => { n = Math.floor(n); if (n >= 1e9) return (n / 1e9).toFixed(2).replace('.', ',') + ' млрд'; if (n >= 1e6) return (n / 1e6).toFixed(2).replace('.', ',') + ' млн'; return n.toLocaleString('ru-RU'); };
const fmtT = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`; };
const now = () => Date.now();
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

// ================= ДАННЫЕ =================
const RAR = {
  common:    { name: 'Обычное',      color: '#9aa39a', chance: 1,    qty: [3, 8], tier: 0 },
  uncommon:  { name: 'Необычное',    color: '#5fbf4a', chance: .7,   qty: [2, 5], tier: 1 },
  rare:      { name: 'Редкое',       color: '#3b8fe0', chance: .45,  qty: [1, 3], tier: 2 },
  epic:      { name: 'Эпическое',    color: '#a35be0', chance: .25,  qty: [1, 2], tier: 3 },
  legendary: { name: 'Легендарное',  color: '#f0a020', chance: .1,   qty: [1, 1], tier: 4 },

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  timer: null, step: 0, next: 0, deg: 2,
  start() { if (this.timer || !AU.ctx) return; this.next = AU.ctx.currentTime + .2; this.timer = setInterval(() => this.sched(), 90); },
  sched() { const c = AU.ctx; while (this.next < c.currentTime + .35) { this.play(this.step, this.next); this.next += 60 / 88 / 2; this.step++; } },
  pluck(m, t, vol, type = 'triangle', dur = .5, cutoff = 2200) {

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

  },
  play(s, t) {
    const night = isNight();
    const root = night ? 57 : 60, sc = night ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9];
    const prog = night ? [0, -4, -2, -5] : [0, 9, 5, 7];
    const bar = Math.floor(s / 8) % 4, off = prog[bar], b = s % 8;
    if (b === 0) {

      [0, 4, 7].forEach((iv, i) => this.pluck(root - 12 + off + (night && iv === 4 ? -1 : iv), t + i * .02, .05, 'sine', 2.4, 900));
    }
    if (b === 4) this.pluck(root - 24 + off + 7, t, .12, 'sine', .9, 500);
    const p = night ? .3 : .55;
    if (Math.random() < p && !(b % 2 && Math.random() < .5)) {
      this.deg = clamp(this.deg + pick([-2, -1, -1, 1, 1, 2, 0]), 0, 9);
      const m = root + sc[this.deg % 5] + 12 * Math.floor(this.deg / 5);

let nextCrow = now() + rnd(70, 110) * 1000;
function spawnCrow() {
  const cand = []; S.beds.forEach((b, i) => { if (b.plant && b.plant.fruits.some(f => f.p >= 1) && !crows.some(c => c.bed === i)) cand.push(i); });
  if (!cand.length) return;
  const i = pick(cand), g = makeCrow(), a = rnd(0, 6.28);
  g.position.set(Math.cos(a) * 45, 20, Math.sin(a) * 45); scene.add(g);
  crows.push({ g, bed: i, state: 'in', t: 0, tx: BED_POS[i].x + rnd(-.6, .6), tz: BED_POS[i].z + rnd(-.6, .6), vy: 0 });
  AU.caw(); toast('🐦 Ворона летит к грядке! Подойди и спугни её', 'warn');
}
function scareCrow(c) {
  if (c.state === 'leave') return;
  c.state = 'leave'; c.vy = 6; S.stats.crows++; AU.caw(); AU.whoosh();
  FX.burst(c.g.position, 14, [0x1c1c24, 0x2a2a36], { up: 2, size: .1, grav: 3 });
  floatText(c.g.position.clone().setY(1.6), 'Кыш!', '#fff'); questCheck();
}
function updateCrows(dt, t) {
  if (!S.gear.scarecrow && now() > nextCrow && S.introDone) { nextCrow = now() + rnd(55, 110) * 1000; spawnCrow(); }
  for (let k = crows.length - 1; k >= 0; k--) {
    const c = crows[k], g = c.g, wl = g.userData.wl, wr = g.userData.wr;
    if (c.state === 'in') {
      const ty = .5, dx = c.tx - g.position.x, dy = ty - g.position.y, dz = c.tz - g.position.z, d = Math.hypot(dx, dy, dz);
      const sp = Math.min(d, 11 * dt); g.position.x += dx / d * sp; g.position.y += dy / d * sp; g.position.z += dz / d * sp;
      g.rotation.y = Math.atan2(dx, dz); const fl = Math.sin(t * 22) * .9; wl.rotation.z = fl; wr.rotation.z = -fl;
      if (d < .15) { c.state = 'eat'; c.t = 11; }
    } else if (c.state === 'eat') {
      wl.rotation.z = .1; wr.rotation.z = -.1; g.rotation.x = Math.max(0, Math.sin(t * 9)) * .5;
      c.t -= dt; const st = S.beds[c.bed];
      const ripe = st.plant ? st.plant.fruits.filter(f => f.p >= 1) : [];
      if (!ripe.length) { c.state = 'leave'; c.vy = 5; continue; }
      if (Math.random() < dt * 3) FX.burst(g.position.clone().setY(.4), 1, PLANTS[st.plant.id].col, { up: 1, size: .07 });
      if (c.t <= 0) {
        const f = ripe[0], d = PLANTS[st.plant.id];
        if (d.multi) { f.p = 0; f.mut = []; } else f.w = +(f.w * .6).toFixed(2);
        toast(`Ворона ${d.multi ? 'утащила' : 'поклевала'}: ${d.name}`, 'warn'); AU.caw(); c.state = 'leave'; c.vy = 5;
      }
    } else {
      g.rotation.x = -.3; c.vy += dt * 2; g.position.y += c.vy * dt;
      const away = g.position.clone().sub(player.g.position).setY(0).normalize();
      g.position.addScaledVector(away, 9 * dt); g.rotation.y = Math.atan2(away.x, away.z);
      const fl = Math.sin(t * 24) * .9; wl.rotation.z = fl; wr.rotation.z = -fl;
      if (g.position.y > 30) { scene.remove(g); crows.splice(k, 1); }
    }
    if (c.state === 'eat' && player.g.position.distanceTo(g.position) < 3) scareCrow(c);
  }
}

  const muts = [...new Set(ripe.flatMap(f => f.mut))];
  const boosts = []; if (st.boost > now()) boosts.push('💧 полито'); if (pl.gf) boosts.push('✨ золото'); if (weather.type === 'rain') boosts.push('🌧️ дождь');
  tipEl.innerHTML = `${iconImg(pl.id, 'tico')}${d.name}<br>${pl.g < 1 ? `Растёт, ещё ${fmtT(timeLeft(st))}` : ripe.length ? `Созрело: ${ripe.length}${d.multi ? ' из ' + d.max : ''}${ripe.length < pl.fruits.length ? `, следующий через ${fmtT(timeLeft(st))}` : ''}` : `Плоды наливаются, ${fmtT(timeLeft(st))}`}${muts.length ? '<br>' + mutTags(muts) : ''}${boosts.length ? `<br><small>${boosts.join(' ')}</small>` : ''}<div class="pb"><i style="width:${prog * 100}%"></i></div>`;
}

// ================= ГЛАВНЫЙ ЦИКЛ =================
let last = performance.now(), acc1 = 0, acc4 = 0, acc10 = 0, sparkAcc = 0;
function loop(nowMs) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (nowMs - last) / 1000); last = nowMs; const t = nowMs / 1000;
  liveTick = true;
  S.beds.forEach((b, i) => { if (b.open && b.plant) advance(b, dt, speedMul(b)); syncBed(i); });
  acc1 += dt; acc4 += dt; acc10 += dt; sparkAcc += dt;
  if (acc1 > 1) {
    acc1 = 0; updateWeather(); updateTimeChip(); questCheck();
    if (restock(false)) { toast('🌱 У Луки новый завоз семян', 'good'); if (S.stock.moonlily) { banner('🌙 Лунное семечко', 'Лука привёз то самое семя. Только этой ночью'); AU.fanfare(); } if (modalOpen === 'seed') openShop('seed', true); }
    const stT = $('#stockT'); if (stT) stT.textContent = fmtT((S.stockAt - now()) / 1000);
  }
  if (acc4 > 4) { acc4 = 0; envMutations(); }
  if (acc10 > 10) { acc10 = 0; save(); }
  if (sparkAcc > .3) {
    sparkAcc = 0;
    S.beds.forEach((b, i) => {
      if (!b.plant) return; const r = b.plant.fruits.filter(f => f.p >= 1); if (!r.length) return;
      const sp = r.some(f => f.mut.includes('gold') || f.mut.includes('rainbow'));
      const p = BED_POS[i]; GLOW.spawn(p.x + rnd(-1, 1), rnd(.4, 1.6), p.z + rnd(-1, 1), 0, rnd(.3, .7), 0, rnd(.6, 1.2), sp ? .16 : .09, sp ? (Math.random() < .5 ? 0xffd34b : 0xffffff) : 0xfff6c0, 0);
    });
  }
  if (menuOff) S.stats.play += dt;
  updatePlayer(dt, t);
  npcs.forEach(n => animChar(n, 0, t, dt));
  updateFishing(dt, t); updatePond(dt, t);
  for (const n of [luka, varya, mitya, fedor]) { let a = Math.atan2(player.g.position.x - n.g.position.x, player.g.position.z - n.g.position.z) - n.g.rotation.y; a = Math.atan2(Math.sin(a), Math.cos(a)); n.head.rotation.y = clamp(a, -1.2, 1.2) * .6; }
  shopMarkers.forEach((m, i) => m.position.y = m.userData.y0 + Math.sin(t * 2 + i) * .15);
  updateCrows(dt, t);
  beds.forEach((b, i) => { if (b.pg) b.pg.rotation.z = Math.sin(t * 1.3 + i) * .025; });
  updateCamera(dt, t); updateEnv(dt, t);
  FX.update(dt); GLOW.update(dt); updateFloats(dt); updateTips(dt);
  renderer.render(scene, camera);
}

// ================= МЕНЮ И СТАРТ =================
function showMenu() { menuOff = false; $('#menu').classList.remove('off'); $('#hud').style.display = 'none'; $('#playBtn').textContent = hadSave || S.introDone ? 'Продолжить' : 'Играть'; }
function startGame() {
  AU.init(); AU.click(); menuOff = true; $('#menu').classList.add('off'); $('#hud').style.display = '';
  cam.yaw = 0; cam.pitch = 1;
  if (!S.introDone) showLetter(NOTES[0], () => { S.introDone = true; S.sel = 'carrot'; renderHotbar(); save(); toast(isTouch ? 'Семена моркови уже в руках. Подойди к грядке и нажми кнопку действия' : 'Семена моркови уже в руках. Подойди к грядке (WASD) и нажми E', 'good'); });
}
$('#playBtn').onclick = startGame;
$('#setBtn').onclick = () => { AU.init(); openSettings(true); };
$('#newBtn').onclick = () => confirmModal('Начать заново?', 'Весь огород, монеты и задания пропадут. Настройки сохранятся.', 'Начать заново', () => {
  S = newState(); try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
  if (scarecrowObj) { scene.remove(scarecrowObj); scarecrowObj = null; }
  crows.forEach(c => scene.remove(c.g)); crows.length = 0;
  refreshPlots(); fishCancel(true);
  beds.forEach((b, i) => { b.key = 'x'; refreshBedVisual(i); });
  player.g.position.set(0, 0, 7); restock(true); renderHotbar(); updateHUD(); renderQuest(); save(); startGame();
});

(function init() {
  // рост за время отсутствия
  const away = Math.min(8 * 3600, (now() - S.last) / 1000);
  if (hadSave && away > 5) { S.beds.forEach(b => { if (b.open && b.plant) advance(b, away, 1 + .25 * S.gear.sprinkler); }); }
  restock(false); if (!Object.keys(S.stock).length) restock(true);
  refreshPlots(); beds.forEach((_, i) => refreshBedVisual(i));
  placeScarecrow(); applyQuality(); renderHotbar(); updateHUD(); renderQuest(); updateTimeChip();
  showMenu();
  if (hadSave && away > 60) setTimeout(() => toast(`Пока тебя не было ${fmtT(away)}, огород подрос`, 'good'), 600);
  requestAnimationFrame(t => { last = t; loop(t); $('#loading').remove(); });
})();
addEventListener('visibilitychange', () => { if (document.hidden) save(); else last = performance.now(); });
addEventListener('pagehide', save);

</script>
